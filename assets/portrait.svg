<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <!-- Roger Haus Self-Portrait Vector -->
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Neck & Shirt -->
  <path d="M 125 240 L 125 285 C 100 295 50 310 40 370 L 280 370 C 270 310 220 295 195 285 L 195 240 Z" fill="#E8E8E4" stroke="#121212" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Intricate Patterned Shirt Collar (Cadavre Exquis doodled collar) -->
  <path d="M 40 370 C 70 320 120 300 160 305 C 200 300 250 320 280 370" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <!-- Doodled textures on shirt -->
  <g stroke="#222" stroke-width="1.5" opacity="0.85">
    <path d="M 60 365 Q 90 330 110 365 M 100 365 Q 130 335 150 365 M 170 365 Q 190 335 220 365 M 210 365 Q 240 330 260 365"/>
    <path d="M 75 350 Q 95 325 115 350 M 130 350 Q 160 320 190 350 M 205 350 Q 225 325 245 350"/>
  </g>

  <!-- Head Outline -->
  <path d="M 160 55 C 225 55 245 105 245 170 C 245 225 210 260 160 260 C 110 260 75 225 75 170 C 75 105 95 55 160 55 Z" fill="#FBFBF9" stroke="#121212" stroke-width="4" stroke-linejoin="round"/>

  <!-- Hair (Short cropped artistic cut) -->
  <path d="M 85 145 C 80 100 100 55 160 55 C 220 55 240 100 235 145 C 230 115 210 90 160 90 C 110 90 90 115 85 145 Z" fill="#18181A"/>
  
  <!-- Ears -->
  <path d="M 77 150 C 65 155 65 185 77 195" fill="#FBFBF9" stroke="#121212" stroke-width="3"/>
  <path d="M 74 165 C 70 170 70 180 75 185" fill="none" stroke="#121212" stroke-width="2"/>
  <path d="M 243 150 C 255 155 255 185 243 195" fill="#FBFBF9" stroke="#121212" stroke-width="3"/>
  <path d="M 246 165 C 250 170 250 180 245 185" fill="none" stroke="#121212" stroke-width="2"/>

  <!-- Eyebrows -->
  <path d="M 105 140 Q 125 132 145 142" fill="none" stroke="#141414" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 175 142 Q 195 132 215 140" fill="none" stroke="#141414" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <ellipse cx="125" cy="158" rx="16" ry="11" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/>
  <circle cx="125" cy="158" r="7.5" fill="#1E1E1E"/>
  <circle cx="127" cy="155" r="2.5" fill="#FFFFFF"/>
  <path d="M 108 155 Q 125 145 142 155" fill="none" stroke="#141414" stroke-width="2"/>

  <!-- Right Eye -->
  <ellipse cx="195" cy="158" rx="16" ry="11" fill="#FFFFFF" stroke="#141414" stroke-width="2.5"/>
  <circle cx="195" cy="158" r="7.5" fill="#1E1E1E"/>
  <circle cx="197" cy="155" r="2.5" fill="#FFFFFF"/>
  <path d="M 178 155 Q 195 145 212 155" fill="none" stroke="#141414" stroke-width="2"/>

  <!-- Nose -->
  <path d="M 160 145 L 157 190 Q 160 195 168 193" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 152 192 Q 155 195 160 195 Q 165 195 168 192" fill="none" stroke="#141414" stroke-width="2"/>

  <!-- Beard & Mustache (Stippled / line textured) -->
  <!-- Mustache -->
  <path d="M 142 208 Q 160 215 178 208" fill="none" stroke="#1E1E1E" stroke-width="4" stroke-linecap="round"/>
  <!-- Mouth -->
  <path d="M 146 220 Q 160 226 174 220" fill="none" stroke="#141414" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Beard outline and stipple -->
  <path d="M 98 175 C 98 220 120 252 160 252 C 200 252 222 220 222 175 C 220 210 200 240 160 240 C 120 240 100 210 98 175 Z" fill="#242426" opacity="0.9"/>
  <!-- Beard texture lines -->
  <g stroke="#18181A" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
    <line x1="140" y1="230" x2="142" y2="236"/>
    <line x1="150" y1="232" x2="151" y2="238"/>
    <line x1="160" y1="234" x2="160" y2="242"/>
    <line x1="170" y1="232" x2="169" y2="238"/>
    <line x1="180" y1="230" x2="178" y2="236"/>
  </g>
</svg>
